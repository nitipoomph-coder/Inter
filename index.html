<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intern Timesheet — บันทึกการฝึกงานรายเดือน</title>
<meta name="description" content="บันทึกเวลาและรายละเอียดงานฝึกงานรายวัน ดูเป็นปฏิทินรายเดือน และส่งออกเป็น Excel สวยงาม">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
</head>
<body>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div>
<header class="topbar">
  <div class="brand"><span class="logo">⏱</span><div><h1>Intern Timesheet</h1><small>บันทึกการฝึกงานรายเดือน</small></div></div>
  <div class="actions">
    <button id="btn-profile" class="btn ghost">👤 ข้อมูลผู้ฝึกงาน</button>
    <button id="btn-export" class="btn primary">⬇ Export Excel</button>
  </div>
</header>

<main class="container">
  <section class="stats" id="stats"></section>

  <section class="card">
    <div class="month-nav">
      <button id="prev" class="icon-btn" aria-label="เดือนก่อน">‹</button>
      <h2 id="month-label"></h2>
      <button id="next" class="icon-btn" aria-label="เดือนถัดไป">›</button>
      <button id="today" class="btn ghost sm">วันนี้</button>
    </div>
    <div class="weekdays"><span>อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span>ส</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot work"></i>ทำงาน</span><span><i class="dot wfh"></i>WFH</span>
      <span><i class="dot leave"></i>ลา</span><span><i class="dot holiday"></i>วันหยุด</span>
    </div>
  </section>

  <section class="card">
    <h3>รายการในเดือนนี้</h3>
    <div class="table-wrap"><table id="list"><thead><tr><th>วันที่</th><th>สถานะ</th><th>เข้า</th><th>ออก</th><th>ชม.</th><th>รายละเอียดงาน</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>

<!-- Day modal -->
<dialog id="day-modal">
  <form method="dialog" id="day-form">
    <h3 id="day-title"></h3>
    <label>สถานะ
      <select id="f-status">
        <option value="work">ทำงาน (On-site)</option><option value="wfh">Work From Home</option>
        <option value="leave">ลา</option><option value="holiday">วันหยุด</option>
      </select>
    </label>
    <div class="row">
      <label>เวลาเข้า<input type="time" id="f-in" value="09:00"></label>
      <label>เวลาออก<input type="time" id="f-out" value="18:00"></label>
      <label>พัก (นาที)<input type="number" id="f-break" value="60" min="0"></label>
    </div>
    <label>รายละเอียดงานที่ทำ<textarea id="f-task" rows="4" placeholder="เช่น พัฒนาหน้า Login, ประชุมทีม..."></textarea></label>
    <label>สิ่งที่ได้เรียนรู้ / ปัญหา<textarea id="f-learn" rows="3" placeholder="(ไม่บังคับ)"></textarea></label>
    <label>หมายเหตุ<input id="f-note" placeholder="เช่น Audit, ช่วยงานพี่..."></label>
    <div class="modal-actions">
      <button type="button" id="btn-delete" class="btn danger">ลบ</button>
      <span style="flex:1"></span>
      <button type="button" id="btn-cancel" class="btn ghost">ยกเลิก</button>
      <button type="submit" id="btn-save" class="btn primary">บันทึก</button>
    </div>
  </form>
</dialog>

<!-- Profile modal -->
<dialog id="profile-modal">
  <form method="dialog" id="profile-form">
    <h3>ข้อมูลผู้ฝึกงาน</h3>
    <label>ชื่อ-นามสกุล<input id="p-name"></label>
    <div class="row"><label>เลขประจำตัวนิสิต<input id="p-id"></label><label>สาขา<input id="p-major"></label></div>
    <div class="row"><label>มหาวิทยาลัย/คณะ<input id="p-uni" placeholder="คณะวิทยาศาสตร์ ศรีราชา ม.เกษตรศาสตร์"></label><label>ภาค/ปีการศึกษา<input id="p-term" placeholder="ต้น 2569"></label></div>
    <div class="row"><label>สถานที่ฝึกงาน<input id="p-company"></label><label>แผนก/ตำแหน่ง<input id="p-dept"></label></div>
    <div class="row"><label>วันเริ่มฝึกงาน<input type="date" id="p-start"></label><label>วันสิ้นสุด<input type="date" id="p-end"></label></div>
    <div class="row"><label>ผู้ควบคุมการฝึกงาน<input id="p-mentor"></label><label>อาจารย์นิเทศ<input id="p-advisor"></label></div>
    <div class="modal-actions"><span style="flex:1"></span><button type="submit" class="btn primary">บันทึก</button></div>
  </form>
</dialog>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
